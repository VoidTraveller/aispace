services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aispace
      POSTGRES_PASSWORD: aispace
      POSTGRES_DB: aispace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    build: .
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  pgdata: