<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AiSpace — бронирование переговорных</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <h1>AiSpace</h1>
        <div id="user-info" class="user-info" style="display:none;">
            <span id="user-name"></span>
            <button id="logout-btn" class="btn-secondary">Выйти</button>
        </div>
    </header>

    <main>
        <div id="error-message" class="error"></div>

        <section id="auth-forms" class="card auth-card">
            <h2>Вход</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <p class="muted"><a href="/register">Нет аккаунта? Зарегистрироваться</a></p>
        </section>

        <div id="app-section" style="display:none;">
            <div class="grid">
                <section class="card">
                    <h2>Комнаты</h2>
                    <ul id="rooms-list" class="list"></ul>
                </section>

                <section class="card">
                    <h2>Занятость</h2>
                    <ul id="bookings-list" class="list"></ul>
                </section>
            </div>

            <section class="card">
                <h2>Забронировать вручную</h2>
                <form id="booking-form">
                    <select id="booking-room" required></select>
                    <input type="text" id="booking-title" placeholder="Тема встречи" required>
                    <label>Период: с
                        <input type="date" id="booking-start-date" required>
                        по
                        <input type="date" id="booking-end-date" required>
                    </label>
                    <label>Время (каждый день): с
                        <input type="time" id="booking-start-time" required>
                        до
                        <input type="time" id="booking-end-time" required>
                    </label>
                    <button type="submit" class="btn-primary">Забронировать</button>
                </form>
            </section>

            <section class="card highlight">
                <h2>Забронировать фразой <span class="badge badge-success">AI</span></h2>
                <form id="nl-form">
                    <input type="text" id="nl-phrase" style="flex:1; min-width:280px;" placeholder="забронируй большую переговорку завтра с 14:00 на полтора часа, обсуждение релиза" required>
                    <button type="submit" class="btn-primary">Отправить</button>
                </form>
            </section>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
